name: webkitgtk
buildsystem: cmake-ninja
build-options:
  cflags: -DNDEBUG -g0
  cxxflags: -DNDEBUG -g0
  strip: true
config-opts:
  - -DCMAKE_BUILD_TYPE=None
  - -DPORT=GTK
  - -DUSE_GTK4=OFF
  - -DUSE_LIBBACKTRACE=OFF
  - -DUSE_LIBSECRET=OFF
  - -DUSE_SYSTEM_SYSPROF_CAPTURE=OFF
  - -DUSE_WOFF2=OFF
  - -DENABLE_BUBBLEWRAP_SANDBOX=OFF
  - -DENABLE_GAMEPAD=OFF
  - -DENABLE_INTROSPECTION=OFF
  - -DENABLE_SPEECH_SYNTHESIS=OFF
  - -DENABLE_SPELLCHECK=OFF
sources:
  - type: archive
    url: https://webkitgtk.org/releases/webkitgtk-2.54.1.tar.xz
    sha256: ea0bbb02dbdbc596874a4e7ad35b66645b3e0a232bd0e4081de5ed92eb0a397d
    
modules:

  - name: unifdef 
    no-autogen: true
    make-install-args:
      - prefix=${FLATPAK_DEST}
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz
        sha256: 43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400
      - type: patch
        path: patch/19.patch
  - name: libyaml #ruby
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz
        sha256: c642ae9b75fee120b2d96c712538bd2cf283228d2337df2cf2988e3c02678ef4
    cleanup:
      - '*'
  - name: ruby
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.7.tar.gz
        sha256: 911ace20f90d068ca0e4dda6d0e4f0f81e52e52f2dd4f4004c721e253412e82d
          
